# LynoOS tren VPS: reverse proxy HTTPS -> /api/* vao api:3310, con lai vao web:3300.
# Chay tu thu muc deploy/ (doc bien tu deploy/.env va deploy/api.env):
#   - VPS DA CO Caddy / Nginx tren may: docker compose up -d   (web/api chi mo 127.0.0.1:3300 / :3310)
#   - VPS TRONG:                         docker compose --profile caddy up -d   (kem container Caddy giu :80/:443)
name: lynoos

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    env_file: api.env
    ports:
      - "127.0.0.1:${API_PORT:-3410}:3310"
    environment:
      PORT: "3310"
      CORS_ORIGINS: https://${DOMAIN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3310/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_SALES_TRAINING_URL: ${NEXT_PUBLIC_SALES_TRAINING_URL:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3400}:3300"
    environment:
      # Next server (trang storefront) goi api qua mang noi bo docker, khong vong ra internet
      API_URL_NOI_BO: http://api:3310
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    profiles: ["caddy"]
    image: caddy:2.10.2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
